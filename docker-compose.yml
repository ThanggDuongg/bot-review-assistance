version: '3.8'

services:
  postgres:
    image: postgres:13-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: langfuse
    ports:
      - "5432:5432"
    networks:
      - app-network

  zookeeper:
    image: zookeeper:3.8
    restart: always
    ports:
      - "2181:2181"
    networks:
      - app-network

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    restart: always
    environment:
      CLICKHOUSE_DB: langfuse
      CLICKHOUSE_USER: langfuse
      CLICKHOUSE_PASSWORD: password
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - ./config.xml:/etc/clickhouse-server/config.d/zookeeper.xml:ro
    depends_on:
      - zookeeper
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  langfuse:
    image: langfuse/langfuse:2.24.1
    restart: always
    ports:
      - "3000:3000"
    environment:
      CLICKHOUSE_USER: langfuse
      CLICKHOUSE_PASSWORD: password
      DATABASE_URL: postgres://postgres:password@postgres:5432/langfuse
      CLICKHOUSE_URL: clickhouse://langfuse:password@clickhouse:9000/langfuse
      CLICKHOUSE_MIGRATION_URL: clickhouse://langfuse:password@clickhouse:9000/langfuse
      NEXTAUTH_SECRET: your-random-secret
      NEXTAUTH_URL: http://localhost:3000
      SALT: your-strong-random-salt
    depends_on:
      postgres:
        condition: service_started
      clickhouse:
        condition: service_healthy
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
